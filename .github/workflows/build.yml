name: Build SmallChatBot

on:
  pull_request:
    paths:
      - "sample-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check encoding with Windows PowerShell
        shell: powershell
        run: ./scripts/Find-NonUtf8Files.ps1

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgJsonGlob: "sample-app/vcpkg.json"

      - name: Restore vcpkg dependencies
        shell: pwsh
        working-directory: sample-app
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows --x-install-root "vcpkg_installed"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[18.0,19.0)"

      - name: Build Visual Studio solution
        shell: pwsh
        run: |
          $solution = "sample-app/SmallChatBot.sln"
          msbuild $solution /m /p:Configuration=Release /p:Platform=x64 /p:VcpkgRoot="${{ runner.temp }}/vcpkg"

      - name: Test redirected Unicode input and output
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $batch = Join-Path $env:RUNNER_TEMP "build-chat-loop-tests.cmd"
          @(
            "call `"$devcmd`" -arch=x64",
            "if errorlevel 1 exit /b 1",
            "cl /nologo /utf-8 /EHsc /std:c++17 /W4 /WX /Isample-app\ChatBot.Core\include /Isample-app\ChatBot.Model\include sample-app\tests\ChatLoopTests.cpp sample-app\ChatBot.Console\src\ChatLoop.cpp /Fe:ChatLoopTests.exe"
          ) | Set-Content -Path $batch -Encoding ascii
          & cmd.exe /c $batch
          if ($LASTEXITCODE -ne 0) { throw "Failed to build chat loop tests." }
          $output = Join-Path $env:RUNNER_TEMP "chat-loop-output.txt"
          $errors = Join-Path $env:RUNNER_TEMP "chat-loop-errors.txt"
          $inputFile = Join-Path $env:RUNNER_TEMP "chat-loop-input.txt"
          $greeting = "$([char]0x3053)$([char]0x3093)$([char]0x306b)$([char]0x3061)$([char]0x306f) $([char]::ConvertFromUtf32(0x1f600))"
          [IO.File]::WriteAllText($inputFile, "$greeting`nsecond`nexit`n", [Text.UTF8Encoding]::new($false))
          $process = Start-Process -FilePath "$PWD\ChatLoopTests.exe" -RedirectStandardInput $inputFile -RedirectStandardOutput $output -RedirectStandardError $errors -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Chat loop tests failed: $([IO.File]::ReadAllText($errors))" }
          $text = [IO.File]::ReadAllText($output, [Text.Encoding]::UTF8)
          $expected = "I$([char]0x2019)m $([char]0x65e5)$([char]0x672c)$([char]::ConvertFromUtf32(0x1f600))"
          if (-not $text.Contains($expected) -or -not $text.Contains("Second response") -or
              ([regex]::Matches($text, "INPUT: ").Count -ne 3)) {
            throw "Unexpected chat loop output: $text"
          }

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sample app in Linux container
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          docker pull "$IMAGE"
          container_id="$(docker create "$IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp sample-app/. "$container_id:/workspace/sample-app/"
          docker start --attach "$container_id"
          mkdir -p "$RUNNER_TEMP/linux-build"
          docker cp "$container_id:/workspace/sample-app/bin/x64/Release/ChatBot.Console.exe" \
            "$RUNNER_TEMP/linux-build/ChatBot.Console.exe"
          test -s "$RUNNER_TEMP/linux-build/ChatBot.Console.exe"
