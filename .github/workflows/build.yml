name: Build SmallChatBot

on:
  push:
    paths:
      - "sample-app/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "sample-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgJsonGlob: "sample-app/vcpkg.json"

      - name: Restore vcpkg dependencies
        shell: pwsh
        working-directory: sample-app
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows --x-install-root "vcpkg_installed"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[18.0,19.0)"

      - name: Build Visual Studio solution
        shell: pwsh
        run: |
          $solution = "sample-app/SmallChatBot.sln"
          msbuild $solution /m /p:Configuration=Release /p:Platform=x64 /p:VcpkgRoot="${{ runner.temp }}/vcpkg"
