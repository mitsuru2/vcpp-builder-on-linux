name: Build SmallChatBot

on:
  push:
    paths:
      - "sample-app/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "sample-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgJsonGlob: "sample-app/vcpkg.json"

      - name: Restore vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows --x-install-root "sample-app/vcpkg_installed" --manifest-root "sample-app"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Visual Studio solution
        shell: pwsh
        run: |
          $solution = "sample-app/SmallChatBot.sln"
          msbuild $solution /m /p:Configuration=Release /p:Platform=x64 /p:VcpkgRoot="${{ runner.temp }}/vcpkg"
